<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador Publicidad 3D - Efecto Salida</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #111; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .panel { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 900px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .control { display: flex; flex-direction: column; font-size: 12px; color: #4caf50; font-weight: bold; }
        input[type="range"] { accent-color: #4caf50; width: 100px; }

        /* Contenedor del Edificio de la Esquina */
        .escena {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background-image: url('https://images.unsplash.com/photo-1540959733332-eab4deceeaf7?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Pantalla deformada en la esquina del edificio */
        .pantalla-led {
            position: absolute;
            top: 24%;
            left: 34.5%;
            width: 38.5%;
            height: 33%;
            transform: rotateX(10deg) rotateY(-28deg) rotateZ(3deg) skewY(2deg);
            transform-style: preserve-3d;
        }

        /* CAPA 1: El Fondo del cartel (se queda adentro) */
        .capa-fondo {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* CAPA 2: El objeto/producto que SALE de la pantalla */
        .capa-objeto {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            transform-style: preserve-3d;
            /* El truco: translateZ la empuja hacia adelante en el espacio 3D */
            transform: translateZ(50px) scale(1); 
            filter: drop-shadow(0 20px 15px rgba(0,0,0,0.7));
        }

        .info-vacia { position: absolute; top: 45%; width: 100%; text-align: center; font-size: 11px; color: #666; pointer-events: none; }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 10px;">Tu App de Publicidad 3D Real</h2>

    <div class="panel">
        <div class="control">
            <label>1. Imagen de Fondo</label>
            <input type="file" id="cargarFondo" accept="image/*">
        </div>
        <div class="control">
            <label>2. Objeto/Producto (PNG)</label>
            <input type="file" id="cargarObjeto" accept="image/*">
        </div>
        <div class="control">
            <label>Efecto Salida (Profundidad)</label>
            <input type="range" id="salida" min="0" max="150" value="40">
        </div>
        <div class="control">
            <label>Mover Objeto (X)</label>
            <input type="range" id="moverX" min="-100" max="100" value="0">
        </div>
        <div class="control">
            <label>Tamaño Objeto</label>
            <input type="range" id="escala" min="0.5" max="2" step="0.1" value="1">
        </div>
    </div>

    <div class="escena">
        <div class="pantalla-led">
            <div class="info-vacia" id="txtAviso">Cargá las imágenes arriba para activar el 3D</div>
            <img class="capa-fondo" id="imgFondo" style="display:none;">
            <img class="capa-objeto" id="imgObjeto" style="display:none;">
        </div>
    </div>

    <script>
        const cargarFondo = document.getElementById('cargarFondo');
        const cargarObjeto = document.getElementById('cargarObjeto');
        const imgFondo = document.getElementById('imgFondo');
        const imgObjeto = document.getElementById('imgObjeto');
        const txtAviso = document.getElementById('txtAviso');

        // Sliders de control
        const sliderSalida = document.getElementById('salida');
        const sliderX = document.getElementById('moverX');
        const sliderEscala = document.getElementById('escala');

        function leerImagen(input, elementoImg) {
            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        elementoImg.src = event.target.result;
                        elementoImg.style.display = 'block';
                        txtAviso.style.display = 'none';
                        actualizarEfecto();
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        leerImagen(cargarFondo, imgFondo);
        leerImagen(cargarObjeto, imgObjeto);

        // Aplicar el movimiento 3D real
        function actualizarEfecto() {
            const z = sliderSalida.value;
            const x = sliderX.value;
            const sc = sliderEscala.value;
            
            // translateZ(zpx) empuja físicamente la imagen del producto fuera de la estructura del edificio
            imgObjeto.style.transform = `translateZ(${z}px) translateX(${x}px) scale(${sc})`;
        }

        sliderSalida.addEventListener('input', actualizarEfecto);
        sliderX.addEventListener('input', actualizarEfecto);
        sliderEscala.addEventListener('input', actualizarEfecto);
    </script>

</body>
</html>
